# lineai-intelligence-build-feedback
name: Build

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '.scripts/**'
      - .gitignore
      - CODE_OF_CONDUCT.md
      - LICENSE
      - README.md

  push:
    branches: [ 'lineai/**' ]

  workflow_call:
    inputs:
      build-artifacts:
        type: boolean
        required: true
        default: false

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      name: Checkout code

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    #if (!UseApiOnly)
    - name: Install Node & cache npm packages
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: src/Web/ClientApp/package-lock.json
    #endif

    - name: Install .NET
      uses: actions/setup-dotnet@v4

    - name: Restore solution
      env:
        NO_COLOR: "1"
        TERM: dumb
      run: dotnet restore 2>&1 | tee ${{ github.workspace }}/build.log

    - name: Build solution
      env:
        NO_COLOR: "1"
        TERM: dumb
      run: dotnet build --no-restore --configuration Release 2>&1 | tee -a ${{ github.workspace }}/build.log

    - name: Test solution
      env:
        NO_COLOR: "1"
        TERM: dumb
      run: dotnet test --no-build --configuration Release --filter "FullyQualifiedName!~AcceptanceTests" 2>&1 | tee -a ${{ github.workspace }}/build.log

    - name: Publish website
      if: ${{ inputs.build-artifacts == true }}
      run: |
        dotnet publish --configuration Release --runtime win-x86 --self-contained --output ./publish
        cd publish
        zip -r ./publish.zip .
      working-directory: ./src/Web/

    - name: Upload website artifact (website)
      if: ${{ inputs.build-artifacts == true }}
      uses: actions/upload-artifact@v4
      with:
        name: website
        path: ./src/Web/publish/publish.zip
        if-no-files-found: error
    
    - name: Create EF Core migrations bundle - Install tool-manifest
      if: ${{ inputs.build-artifacts == true }}
      run: |
        dotnet new tool-manifest
      env:
        SkipNSwag: True

    - name: Create EF Core migrations bundle - Install dotnet-ef
      if: ${{ inputs.build-artifacts == true }}
      run: |
        dotnet tool install dotnet-ef --version 8.0.1
      env:
        SkipNSwag: True


    - name: Create EF Core migrations bundle - bundle migrations
      if: ${{ inputs.build-artifacts == true }}
      run: |
        dotnet ef migrations bundle --configuration Release -p ./src/Infrastructure/ -s ./src/Web/ -o efbundle.exe
      env:
        SkipNSwag: True


    - name: Create EF Core migrations bundle - zip migrations bundle
      if: ${{ inputs.build-artifacts == true }}
      run: |
        zip -r ./efbundle.zip efbundle.exe
      env:
        SkipNSwag: True

    - name: Upload EF Core migrations bundle artifact (efbundle)
      if: ${{ inputs.build-artifacts == true }}
      uses: actions/upload-artifact@v4
      with:
        name: efbundle
        path: ./efbundle.zip
        if-no-files-found: error

    - name: Ensure Lineai build.log exists
      if: always()
      shell: bash
      run: |
        if [ ! -f "${{ github.workspace }}/build.log" ]; then
          echo "No teed build.log found; a step may have failed before log capture." > "${{ github.workspace }}/build.log"
          echo "Workflow: ${{ github.workflow }}" >> "${{ github.workspace }}/build.log"
          echo "Job status: ${{ job.status }}" >> "${{ github.workspace }}/build.log"
        fi

    - name: Send Lineai Build Info
      if: always()
      uses: lineai-intelligence/lineai-send-build-info-github-action@v1.0.3
      with:
        lineai_host: ${{ vars.LINEAI_HOST }}
        agent_uuid: ${{ vars.AGENT_UUID }}
        agent_password: ${{ secrets.AGENT_PASSWORD }}
        scan_path: /github/workspace
        job_name: ${{ github.workflow }}
        build_number: ${{ github.run_number }}
        build_status: ${{ job.status }}
        pipeline_system: GitHub Actions
        log_file: /github/workspace/build.log
